name: Update supply
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-supply
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit
        run: |
          git config user.name "supply-bot"
          git config user.email "supply-bot@users.noreply.github.com"
          git add total.json circulating.json supply.json
          git diff --cached --quiet || git commit -m "supply update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
